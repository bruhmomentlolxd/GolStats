# Configuración para publicar GolStats gratis en Render (https://render.com)
services:
  - type: web
    name: golstats
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FOOTBALL_API_KEY
        sync: false          # se escribe a mano en el panel de Render (no queda en el código)
      - key: SECRET_KEY
        generateValue: true
